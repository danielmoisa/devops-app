apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-app
  namespace: argocd
spec:
  project: default
  source:
    # https, not the git@ remote — argocd has no ssh key configured for this repo
    repoURL: https://github.com/danielmoisa/devops-app.git
    targetRevision: main
    path: chart/devops-app
  destination:
    server: https://kubernetes.default.svc
    namespace: devops-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
